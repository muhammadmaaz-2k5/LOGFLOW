services:
  postgres:
    image: postgres:16-alpine
    container_name: logflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logflow}
      POSTGRES_DB: ${POSTGRES_DB:-logflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logflow} -d ${POSTGRES_DB:-logflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: logflow-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: logflow
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: logflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://logflow:logflow@postgres:5432/logflow
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: logflow-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  chdata:
